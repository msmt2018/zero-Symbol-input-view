name: Android CI

on:
  push:
    branches-ignore:
      - 'renovate/*'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.idea/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_BIN: ${{ secrets.SIGNING_STORE_BIN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify stable debug APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          KEYSTORE="app/keys/zerostudio-debug.keystore"
          test -s "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/debug-keystore.txt"
          EXPECTED="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/debug-keystore.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          keytool -printcert -jarfile "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED"
          test -n "$ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Debug APK certificate does not match the checked-in stable debug keystore."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Verified APK signature matches app/keys/zerostudio-debug.keystore (SHA-256: $ACTUAL)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  v2-library-validation:
    name: V2 Library build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Build V2 library debug and release variants
        run: ./gradlew :zero-symbol-input-view-v2:assembleDebug :zero-symbol-input-view-v2:assembleRelease

      - name: Run V2 library unit tests
        run: ./gradlew :zero-symbol-input-view-v2:testDebugUnitTest

      - name: Upload V2 unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-unit-test-diagnostics
          if-no-files-found: warn
          path: |
            zero-symbol-input-view-v2/build/reports/tests/testDebugUnitTest/**
            zero-symbol-input-view-v2/build/test-results/testDebugUnitTest/**
            zero-symbol-input-view-v2/build/reports/problems/**

      - name: Compile V2 library instrumentation tests
        run: ./gradlew :zero-symbol-input-view-v2:assembleDebugAndroidTest

  compose-library-validation:
    name: Compose V2 library build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      # The native Oniguruma submodule requires this exact NDK. Install it
      # before Gradle configuration so a transient/corrupt SDK download can
      # be retried independently instead of failing the entire Compose job.
      - name: Install required NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;27.1.12297006" &&
              test -x "$SDK_ROOT/ndk/27.1.12297006/ndk-build"; then
              echo "NDK 27.1.12297006 is installed and verified."
              exit 0
            fi
            echo "::warning::NDK installation attempt $attempt failed; cleaning the incomplete package before retry."
            rm -rf "$SDK_ROOT/ndk/27.1.12297006"
            sleep $((attempt * 15))
          done
          echo "::error::Unable to install NDK 27.1.12297006 after three attempts."
          exit 1

      - name: Audit Compose migration inventory
        run: ./gradlew :zero-symbol-input-view-v2-compose:auditComposeMigration

      - name: Enforce Compose source, core-state, artifact, and runtime dependency boundaries
        run: >-
          ./gradlew
          :zero-symbol-input-view-v2-compose:verifyComposeUiBoundary
          :zero-symbol-input-view-v2-compose:verifyCoreStateEngineBoundary
          :zero-symbol-input-view-v2-compose:verifyComposeArtifactBoundary
          :zero-symbol-input-view-v2-compose:verifyComposeResolvedDependencyBoundary

      - name: Build Compose V2 debug and release variants
        run: ./gradlew :zero-symbol-input-view-v2-compose:assembleDebug :zero-symbol-input-view-v2-compose:assembleRelease

      - name: Run Compose V2 unit tests
        run: ./gradlew :zero-symbol-input-view-v2-compose:testDebugUnitTest

      - name: Upload Compose V2 unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-v2-unit-test-diagnostics
          if-no-files-found: warn
          path: |
            zero-symbol-input-view-v2-compose/build/reports/tests/testDebugUnitTest/**
            zero-symbol-input-view-v2-compose/build/test-results/testDebugUnitTest/**
            zero-symbol-input-view-v2-compose/build/reports/problems/**

      - name: Compile Compose V2 instrumentation tests
        run: ./gradlew :zero-symbol-input-view-v2-compose:assembleDebugAndroidTest

  compose-library-instrumentation:
    name: Compose V2 runtime instrumentation - Android 35
    runs-on: ubuntu-latest
    needs: compose-library-validation
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose V2 instrumentation suite on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: ./gradlew :zero-symbol-input-view-v2-compose:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Compose instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-v2-instrumentation-diagnostics
          if-no-files-found: warn
          path: |
            zero-symbol-input-view-v2-compose/build/reports/androidTests/**
            zero-symbol-input-view-v2-compose/build/outputs/androidTest-results/**
            zero-symbol-input-view-v2-compose/build/outputs/logs/**

  v2-library-instrumentation:
    # This job exercises the frozen legacy View implementation. Keep running
    # it for diagnostics, but do not let its known UI-contract failures block
    # the new Compose module while the legacy module is intentionally untouched.
    name: Legacy V2 View instrumentation (non-blocking) - Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    needs: v2-library-validation
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Cover minSdk, a representative modern release, and Android 15.
        # Every run executes the full connectedDebugAndroidTest suite.
        api-level: [21, 29, 35]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run complete V2 instrumentation suite on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: bash scripts/run-v2-instrumentation.sh

      - name: Upload V2 instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-instrumentation-diagnostics-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            zero-symbol-input-view-v2/build/reports/androidTests/**
            zero-symbol-input-view-v2/build/outputs/androidTest-results/**
            zero-symbol-input-view-v2/build/outputs/logs/**
            zero-symbol-input-view-v2/build/diagnostics/**

  maven-publication-validation:
    name: V2 Maven publication validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Publish V2 release to local Maven repository
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/maven-publication-gradle.log"
          for attempt in 1 2 3; do
            STATUS=0
            if ./gradlew :zero-symbol-input-view-v2:publishReleasePublicationToMavenLocal --no-daemon --stacktrace >"$LOG" 2>&1; then
              cat "$LOG"
              exit 0
            else
              STATUS=$?
            fi
            cat "$LOG"
            if grep -Eqi 'status code 429|Too Many Requests|status code 5[0-9][0-9]|HTTP 5[0-9][0-9]|temporarily unavailable|Connection reset|Read timed out|Connect timed out' "$LOG"; then
              if [ "$attempt" -lt 3 ]; then
                DELAY=$((attempt * 30))
                echo "::warning::Transient Maven/dependency repository failure; retrying publication validation in ${DELAY}s (attempt ${attempt}/3)."
                sleep "$DELAY"
                continue
              fi
            fi
            echo "::error::Maven publication validation failed after attempt ${attempt}; see Gradle output above."
            exit "$STATUS"
          done
          echo "::error::Maven publication validation exhausted its retry budget."
          exit 1
        env:
          VERSION: 0.0.0-ci

      - name: Verify Maven coordinates and published artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.0.0-ci"
          REPOSITORY="$HOME/.m2/repository/com/github/msmt2018/zero-Symbol-input-view/zero-symbol-input-view-v2/$VERSION"
          POM="$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          AAR="$REPOSITORY/zero-symbol-input-view-v2-$VERSION.aar"
          SOURCES="$REPOSITORY/zero-symbol-input-view-v2-$VERSION-sources.jar"
          test -s "$POM"
          test -s "$AAR"
          test -s "$SOURCES"
          grep -Fq '<groupId>com.github.msmt2018.zero-Symbol-input-view</groupId>' "$POM"
          grep -Fq '<artifactId>zero-symbol-input-view-v2</artifactId>' "$POM"
          grep -Fq "<version>$VERSION</version>" "$POM"
          grep -Fq "GNU Affero General Public License v3.0 only (AGPL-3.0-only)" "$POM"
          unzip -t "$AAR" >/dev/null
          unzip -t "$SOURCES" >/dev/null
          echo "Verified local Maven publication for com.github.msmt2018.zero-Symbol-input-view:zero-symbol-input-view-v2:$VERSION"

  compose-maven-publication-validation:
    name: Compose V2 Maven publication validation
    runs-on: ubuntu-latest
    needs: compose-library-validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Publish Compose V2 release to local Maven repository
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :zero-symbol-input-view-v2-compose:publishReleasePublicationToMavenLocal --no-daemon --stacktrace
        env:
          VERSION: 0.0.0-ci

      - name: Verify Compose Maven coordinates, artifacts and AGPL metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.0.0-ci"
          REPOSITORY="$HOME/.m2/repository/com/github/msmt2018/zero-Symbol-input-view/zero-symbol-input-view-v2-compose/$VERSION"
          POM="$REPOSITORY/zero-symbol-input-view-v2-compose-$VERSION.pom"
          AAR="$REPOSITORY/zero-symbol-input-view-v2-compose-$VERSION.aar"
          SOURCES="$REPOSITORY/zero-symbol-input-view-v2-compose-$VERSION-sources.jar"
          test -s "$POM"
          test -s "$AAR"
          test -s "$SOURCES"
          grep -Fq '<groupId>com.github.msmt2018.zero-Symbol-input-view</groupId>' "$POM"
          grep -Fq '<artifactId>zero-symbol-input-view-v2-compose</artifactId>' "$POM"
          grep -Fq "<version>$VERSION</version>" "$POM"
          grep -Fq "GNU Affero General Public License v3.0 only (AGPL-3.0-only)" "$POM"
          unzip -t "$AAR" >/dev/null
          unzip -t "$SOURCES" >/dev/null
          echo "Verified local Maven publication for com.github.msmt2018.zero-Symbol-input-view:zero-symbol-input-view-v2-compose:$VERSION"
