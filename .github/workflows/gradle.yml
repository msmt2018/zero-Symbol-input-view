name: Android CI

on:
  push:
    branches-ignore:
      - 'renovate/*'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_BIN: ${{ secrets.SIGNING_STORE_BIN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify stable debug APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          keytool -printcert -jarfile "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="a2e40e2ca4f9d280c08e2e2629beac0580bfe8e501f7ae233a824f5eb12e1582"
          test "$ACTUAL" = "$EXPECTED"
          echo "Verified stable debug signing certificate SHA-256: $ACTUAL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ !github.head_ref }}
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  v2-library-validation:
    name: V2 Library build, unit tests and publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Build V2 library debug and release variants
        run: ./gradlew :zero-symbol-input-view-v2:assembleDebug :zero-symbol-input-view-v2:assembleRelease

      - name: Run V2 library unit tests
        run: ./gradlew :zero-symbol-input-view-v2:testDebugUnitTest

      - name: Compile V2 library instrumentation tests
        run: ./gradlew :zero-symbol-input-view-v2:assembleDebugAndroidTest

      - name: Validate V2 Maven publication
        run: |
          set -euo pipefail
          ./gradlew :zero-symbol-input-view-v2:publishReleasePublicationToMavenLocal
          REPOSITORY="$HOME/.m2/repository/com/github/msmt2018/zero-Symbol-input-view/zero-symbol-input-view-v2/$VERSION"
          test -s "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          test -s "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.aar"
          test -s "$REPOSITORY/zero-symbol-input-view-v2-$VERSION-sources.jar"
          grep -q '<groupId>com.github.msmt2018.zero-Symbol-input-view</groupId>' "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          grep -q '<artifactId>zero-symbol-input-view-v2</artifactId>' "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          echo "Verified POM, release AAR and sources JAR for $VERSION."
        env:
          VERSION: ci-${{ github.sha }}

  v2-library-instrumentation:
    name: V2 Library Android 15 instrumentation tests
    runs-on: ubuntu-latest
    needs: v2-library-validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run V2 instrumentation tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: bash scripts/run-v2-instrumentation.sh
