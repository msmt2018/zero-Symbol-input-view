name: Android CI

on:
  push:
    branches-ignore:
      - 'renovate/*'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.github/**'
      - '.idea/**'
      - '!.github/workflows/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_BIN: ${{ secrets.SIGNING_STORE_BIN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.0
        with:
          access_token: ${{ github.token }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant Permissions for Gradle
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug

      - name: Run V2 symbol drawer unit tests
        run: ./gradlew :zero-symbol-input-view-v2:testDebugUnitTest

      - name: Compile V2 symbol drawer instrumentation tests
        run: ./gradlew :zero-symbol-input-view-v2:assembleDebugAndroidTest

      - name: Run V2 instrumentation tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :zero-symbol-input-view-v2:connectedDebugAndroidTest

      - name: Validate V2 Maven publication
        run: |
          set -euo pipefail
          ./gradlew :zero-symbol-input-view-v2:publishReleasePublicationToMavenLocal
          REPOSITORY="$HOME/.m2/repository/com/github/msmt2018/zero-Symbol-input-view/zero-symbol-input-view-v2/$VERSION"
          test -s "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          test -s "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.aar"
          test -s "$REPOSITORY/zero-symbol-input-view-v2-$VERSION-sources.jar"
          grep -q '<groupId>com.github.msmt2018.zero-Symbol-input-view</groupId>' "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          grep -q '<artifactId>zero-symbol-input-view-v2</artifactId>' "$REPOSITORY/zero-symbol-input-view-v2-$VERSION.pom"
          echo "Verified POM, release AAR and sources JAR for $VERSION."
        env:
          VERSION: ci-${{ github.sha }}

      - name: Publish snapshot
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.build.outcome == 'success' }}
        run: ./gradlew publishAllPublicationsToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MVN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MVN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MVN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MVN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MVN_SIGNING_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ !github.head_ref }}
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
