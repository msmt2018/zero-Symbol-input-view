name: One-time AGPL-3.0-only migration

on:
  push:
    branches:
      - feat/compose-symbol-drawer-v2
    paths:
      - ".github/workflows/one-time-agpl-migration.yml"
      - "tools/relicense_agpl.py"

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/feat/compose-symbol-drawer-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compose-symbol-drawer-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply AGPL license and source headers
        run: python tools/relicense_agpl.py
      - name: Commit migration and remove temporary migration tooling
        run: |
          git config user.name "android_zero"
          git config user.email "31156953+msmt2018@users.noreply.github.com"
          git rm -f .github/workflows/one-time-agpl-migration.yml tools/relicense_agpl.py
          git add -A
          if git diff --cached --quiet; then
            echo "No license changes were necessary."
            exit 0
          fi
          git commit -m "chore(license): standardize project modules on AGPL-3.0-only"
          git push origin HEAD:feat/compose-symbol-drawer-v2
